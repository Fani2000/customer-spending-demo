version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: customer-spending-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customerdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Customer Service
  customer-service:
    build:
      context: ../../src
      dockerfile: Services/CustomerService/Dockerfile
    container_name: customer-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=customerdb;Username=postgres;Password=postgres
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/graphql || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Spending Service
  spending-service:
    build:
      context: ../../src
      dockerfile: Services/SpendingService/Dockerfile
    container_name: spending-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=customerdb;Username=postgres;Password=postgres
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/graphql || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Transaction Service
  transaction-service:
    build:
      context: ../../src
      dockerfile: Services/TransactionService/Dockerfile
    container_name: transaction-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=customerdb;Username=postgres;Password=postgres
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/graphql || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # GraphQL Gateway
  gateway:
    build:
      context: ../../src
      dockerfile: Gateway/Dockerfile
    container_name: gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:80
      - Cors__AllowedOrigins__2=http://localhost
      # Gateway will auto-detect gateway.docker.fgp if it exists
      # Otherwise it will use gateway.fgp (which should be updated for Docker service names)
    ports:
      - "5000:8080"
    depends_on:
      customer-service:
        condition: service_healthy
      spending-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/graphql || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ../../src/frontend
      dockerfile: Dockerfile
      args:
        - VITE_GRAPHQL_ENDPOINT=/graphql
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge

