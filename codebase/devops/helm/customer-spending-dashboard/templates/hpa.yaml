{{- if .Values.customerService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "customer-spending-dashboard.fullname" . }}-customer-service
  labels:
    {{- include "customer-spending-dashboard.labels" . | nindent 4 }}
    component: customer-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "customer-spending-dashboard.fullname" . }}-customer-service
  minReplicas: {{ .Values.customerService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.customerService.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.customerService.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.customerService.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.customerService.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.customerService.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
---
{{- end }}
