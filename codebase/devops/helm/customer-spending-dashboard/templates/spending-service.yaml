{{- if .Values.spendingService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer-spending-dashboard.fullname" . }}-spending-service
  labels:
    {{- include "customer-spending-dashboard.labels" . | nindent 4 }}
    component: spending-service
spec:
  replicas: {{ .Values.spendingService.replicaCount }}
  selector:
    matchLabels:
      {{- include "customer-spending-dashboard.selectorLabels" . | nindent 6 }}
      component: spending-service
  template:
    metadata:
      labels:
        {{- include "customer-spending-dashboard.selectorLabels" . | nindent 8 }}
        component: spending-service
    spec:
      containers:
      - name: spending-service
        image: "{{ .Values.global.imageRegistry }}{{ .Values.spendingService.image.repository }}:{{ .Values.spendingService.image.tag }}"
        imagePullPolicy: {{ .Values.spendingService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ .Values.spendingService.env.ASPNETCORE_ENVIRONMENT | quote }}
        - name: ASPNETCORE_URLS
          value: {{ .Values.spendingService.env.ASPNETCORE_URLS | quote }}
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            configMapKeyRef:
              name: {{ include "customer-spending-dashboard.fullname" . }}-config
              key: Database__ConnectionString
        livenessProbe:
          httpGet:
            path: /graphql
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /graphql
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.spendingService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "customer-spending-dashboard.fullname" . }}-spending-service
  labels:
    {{- include "customer-spending-dashboard.labels" . | nindent 4 }}
    component: spending-service
spec:
  type: {{ .Values.spendingService.service.type }}
  ports:
  - port: {{ .Values.spendingService.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "customer-spending-dashboard.selectorLabels" . | nindent 4 }}
    component: spending-service
{{- end }}

