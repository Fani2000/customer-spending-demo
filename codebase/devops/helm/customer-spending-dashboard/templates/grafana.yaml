{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer-spending-dashboard.fullname" . }}-grafana
  labels:
    {{- include "customer-spending-dashboard.labels" . | nindent 4 }}
    component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "customer-spending-dashboard.selectorLabels" . | nindent 6 }}
      component: grafana
  template:
    metadata:
      labels:
        {{- include "customer-spending-dashboard.selectorLabels" . | nindent 8 }}
        component: grafana
    spec:
      containers:
      - name: grafana
        image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
        imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.grafana.adminUser | quote }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.grafana.adminPassword | quote }}
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        resources:
          {{- toYaml .Values.grafana.resources | nindent 10 }}
      volumes:
      - name: storage
        {{- if .Values.grafana.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "customer-spending-dashboard.fullname" . }}-grafana-storage
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: datasources
        configMap:
          name: {{ include "customer-spending-dashboard.fullname" . }}-grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "customer-spending-dashboard.fullname" . }}-grafana
  labels:
    {{- include "customer-spending-dashboard.labels" . | nindent 4 }}
    component: grafana
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
  - port: {{ .Values.grafana.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "customer-spending-dashboard.selectorLabels" . | nindent 4 }}
    component: grafana
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "customer-spending-dashboard.fullname" . }}-grafana-datasources
  labels:
    {{- include "customer-spending-dashboard.labels" . | nindent 4 }}
    component: grafana
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      {{- range .Values.grafana.datasources }}
      - name: {{ .name }}
        type: {{ .type }}
        access: {{ .access }}
        url: {{ .url | replace "customer-spending-dashboard" (include "customer-spending-dashboard.fullname" $) }}
        isDefault: {{ .isDefault }}
        editable: true
      {{- end }}
{{- if .Values.grafana.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "customer-spending-dashboard.fullname" . }}-grafana-storage
  labels:
    {{- include "customer-spending-dashboard.labels" . | nindent 4 }}
    component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
  {{- if .Values.grafana.persistence.storageClass }}
  storageClassName: {{ .Values.grafana.persistence.storageClass }}
  {{- end }}
{{- end }}
{{- end }}

