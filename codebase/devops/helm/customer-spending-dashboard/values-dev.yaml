# Development Environment Values
# Override default values for development

global:
  environment: development
  imageRegistry: ""
  imagePullSecrets: []

# PostgreSQL Configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    postgresPassword: "dev-postgres-password"
    database: "customerdb"
    username: "postgres"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Customer Service
customerService:
  enabled: true
  image:
    repository: customer-spending/customer-service
    tag: "dev"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    ASPNETCORE_ENVIRONMENT: "Development"
    ASPNETCORE_URLS: "http://+:8080"

# Spending Service
spendingService:
  enabled: true
  image:
    repository: customer-spending/spending-service
    tag: "dev"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    ASPNETCORE_ENVIRONMENT: "Development"
    ASPNETCORE_URLS: "http://+:8080"

# Transaction Service
transactionService:
  enabled: true
  image:
    repository: customer-spending/transaction-service
    tag: "dev"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    ASPNETCORE_ENVIRONMENT: "Development"
    ASPNETCORE_URLS: "http://+:8080"

# Gateway Service
gateway:
  enabled: true
  image:
    repository: customer-spending/gateway
    tag: "dev"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    ASPNETCORE_ENVIRONMENT: "Development"
    ASPNETCORE_URLS: "http://+:8080"
    Cors__AllowedOrigins__0: "http://localhost:3000"
    Cors__AllowedOrigins__1: "http://localhost:5173"
    Cors__AllowedOrigins__2: "https://dev.customer-spending.local"

# Frontend
frontend:
  enabled: true
  image:
    repository: customer-spending/frontend
    tag: "dev"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    VITE_GRAPHQL_ENDPOINT: "/graphql"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  hosts:
    - host: dev.customer-spending.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /graphql
          pathType: Prefix
          service: gateway
  tls: []

# Secrets
secrets:
  postgresPassword: "dev-postgres-password"

# ConfigMaps
configMap:
  database:
    connectionString: "Host={{ include \"customer-spending-dashboard.fullname\" . }}-postgres;Port=5432;Database=customerdb;Username=postgres;Password=dev-postgres-password"

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Prometheus Configuration
prometheus:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
  retention:
    time: "48h"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# Grafana Configuration
grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "100m"
  datasources:
    - name: Prometheus
      type: prometheus
      url: http://customer-spending-dashboard-prometheus:9090
      access: proxy
      isDefault: true

